<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
    @font-face {
        font-family: 'Inter';
        font-weight: 300 900;
        src: url('../fonts/inter-var.woff2') format('woff2');
    }
    @font-face {
        font-family: 'Space Grotesk';
        font-weight: 400 700;
        src: url('../fonts/space-grotesk-var.woff2') format('woff2');
    }
    @font-face {
        font-family: 'JetBrains Mono';
        font-weight: 400 700;
        src: url('../fonts/jetbrains-mono-var.woff2') format('woff2');
    }

    :root {
        --bg: #0e0e0c;
        --bg-sheet: #141411;
        --bg-inset: #0b0b09;
        --grid-dot: rgba(238, 237, 232, 0.11);

        --ink: #eeede8;
        --ink-secondary: #bbb8ae;
        --ink-muted: #9c988e;

        --line: rgba(238, 237, 232, 0.16);
        --line-strong: rgba(238, 237, 232, 0.34);
        --tick: rgba(238, 237, 232, 0.54);

        --accent: rgb(240, 106, 60);
        --accent-ink: #f4865e;
        --accent-tint: rgba(240, 106, 60, 0.10);

        --font-display: 'Space Grotesk', 'Inter', system-ui, sans-serif;
        --font-sans: 'Inter', system-ui, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
    }

    body {
        background-color: var(--bg);
        background-image: radial-gradient(circle, var(--grid-dot) 1px, transparent 1px);
        background-size: 24px 24px;
        font-family: var(--font-sans);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        padding: 36px 40px;
    }

    .sheet {
        position: relative;
        width: 1120px;
        height: 558px;
        background: var(--bg-sheet);
        border: 1px solid var(--line-strong);
        display: flex;
        flex-direction: column;
    }

    .sheet::before,
    .sheet::after {
        content: '+';
        position: absolute;
        font-family: var(--font-mono);
        font-size: 14px;
        line-height: 1;
        color: var(--tick);
    }
    .sheet::before { top: -8px; left: -5px; }
    .sheet::after { bottom: -8px; right: -5px; }

    .main-split {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 616px 1fr;
    }

    .copy-col {
        padding: 42px 44px 36px 48px;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .fig-kicker {
        font-family: var(--font-mono);
        font-size: 16px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent-ink);
    }

    .headline-block {
        display: flex;
        flex-direction: column;
    }

    h1 {
        font-family: var(--font-display);
        font-size: 70px;
        font-weight: 700;
        line-height: 0.98;
        letter-spacing: -0.03em;
        color: var(--ink);
    }

    .role {
        margin-top: 22px;
        font-family: var(--font-mono);
        font-size: 24px;
        font-weight: 500;
        line-height: 1.3;
        color: var(--ink);
    }

    .summary {
        margin-top: 20px;
        font-size: 21px;
        font-weight: 400;
        line-height: 1.5;
        color: var(--ink-secondary);
        max-width: 510px;
    }

    .diagram-col {
        background: var(--bg-inset);
        padding: 20px 26px 20px 26px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .diagram-bar {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        font-family: var(--font-mono);
        font-size: 15px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
    }

    .diagram-fig {
        color: var(--accent-ink);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
    }

    .diagram-title {
        color: var(--ink-muted);
        font-weight: 500;
    }

    .arch-svg {
        width: 450px;
        height: 416px;
        display: block;
    }

    .svg-box {
        fill: var(--bg-sheet);
        stroke: var(--line-strong);
        stroke-width: 1;
    }
    .svg-box-accent {
        fill: var(--accent-tint);
        stroke: var(--accent);
        stroke-width: 1;
    }
    .svg-chip {
        fill: var(--bg-inset);
        stroke: var(--line-strong);
        stroke-width: 1;
    }
    .svg-wire {
        fill: none;
        stroke: var(--line-strong);
        stroke-width: 1;
        stroke-linecap: square;
    }
    .svg-wire-accent {
        fill: none;
        stroke: var(--accent);
        stroke-width: 1;
        stroke-linecap: square;
    }
    .svg-wire-loop {
        fill: none;
        stroke: var(--accent);
        stroke-width: 1;
        stroke-dasharray: 4 4;
    }
    .svg-arrow { fill: var(--line-strong); }
    .svg-arrow-accent { fill: var(--accent); }

    .svg-idx {
        font-family: var(--font-mono);
        font-size: 18px;
        font-weight: 600;
        fill: var(--accent-ink);
    }
    .svg-label {
        font-family: var(--font-mono);
        font-size: 18px;
        font-weight: 600;
        fill: var(--ink);
    }
    .svg-agent {
        font-family: var(--font-sans);
        font-size: 18px;
        font-weight: 600;
        fill: var(--ink);
    }
    .svg-sub {
        font-family: var(--font-sans);
        font-size: 18px;
        font-weight: 400;
        fill: var(--ink-secondary);
    }
    .svg-tag {
        font-family: var(--font-mono);
        font-size: 18px;
        font-weight: 400;
        fill: var(--ink-muted);
    }

    .sheet-foot {
        height: 60px;
        flex-shrink: 0;
        border-top: 1px solid var(--line);
        background: var(--bg-inset);
        padding: 0 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: var(--font-mono);
        font-size: 18px;
    }

    .foot-loc {
        color: var(--ink-secondary);
    }

    .foot-domain {
        color: var(--ink);
        font-weight: 600;
    }
</style>
</head>
<body>
    <div class="sheet">
        <div class="main-split">
            <div class="copy-col">
                <div class="fig-kicker">FIG 00 &middot; PORTFOLIO</div>
                <div class="headline-block">
                    <h1>Constantino<br>Ferrucci</h1>
                    <p class="role">Senior GenAI Engineer</p>
                    <p class="summary">RAG and agent systems &middot; LangGraph &middot; MCP &middot; Computer Vision at UNR</p>
                </div>
            </div>

            <div class="diagram-col">
                <div class="diagram-bar">
                    <span class="diagram-fig">FIG 01</span>
                    <span class="diagram-title">Agent Architecture</span>
                </div>

                <svg class="arch-svg" viewBox="0 0 450 416" width="450" height="416" aria-hidden="true">
                    <rect x="0.5" y="0.5" width="449" height="415" fill="none" stroke="var(--line)" stroke-width="1"/>

                    <!-- Supervisor fan-out to 3 agents -->
                    <path class="svg-wire-accent" d="M225 106 L225 130 L86 130 L86 152"/>
                    <path class="svg-wire" d="M225 130 L225 152"/>
                    <path class="svg-wire" d="M225 130 L364 130 L364 152"/>
                    <polygon class="svg-arrow-accent" points="86,154 81,146 91,146"/>
                    <polygon class="svg-arrow" points="225,154 220,146 230,146"/>
                    <polygon class="svg-arrow" points="364,154 359,146 369,146"/>

                    <!-- Bidirectional wires: Agents <-> MCP tool layer -->
                    <path class="svg-wire" d="M86 250 L86 292"/>
                    <polygon class="svg-arrow" points="86,248 81,256 91,256"/>
                    <polygon class="svg-arrow" points="86,294 81,286 91,286"/>

                    <path class="svg-wire" d="M225 250 L225 292"/>
                    <polygon class="svg-arrow" points="225,248 220,256 230,256"/>
                    <polygon class="svg-arrow" points="225,294 220,286 230,286"/>

                    <path class="svg-wire" d="M364 250 L364 292"/>
                    <polygon class="svg-arrow" points="364,248 359,256 369,256"/>
                    <polygon class="svg-arrow" points="364,294 359,286 369,286"/>

                    <!-- Subtle dashed feedback rail: Agents -> Supervisor -->
                    <path class="svg-wire-loop" d="M426 202 L439 202 L439 64 L428 64"/>
                    <polygon class="svg-arrow-accent" points="426,64 434,59 434,69"/>

                    <!-- 01 Supervisor (key node) -->
                    <rect class="svg-box-accent" x="24" y="22" width="402" height="84"/>
                    <line x1="24" y1="58" x2="426" y2="58" stroke="var(--accent)" stroke-width="1" stroke-opacity="0.45"/>
                    <text class="svg-idx" x="38" y="47">01</text>
                    <text class="svg-label" x="72" y="47">Supervisor</text>
                    <text class="svg-tag" x="412" y="47" text-anchor="end">LangGraph</text>
                    <text class="svg-sub" x="38" y="88">Plans steps and routes work</text>

                    <!-- 02a Retrieval agent -->
                    <rect class="svg-box" x="24" y="154" width="124" height="94"/>
                    <line x1="24" y1="190" x2="148" y2="190" stroke="var(--line)" stroke-width="1"/>
                    <text class="svg-idx" x="86" y="179" text-anchor="middle">02a</text>
                    <text class="svg-agent" x="86" y="226" text-anchor="middle">Retrieval</text>

                    <!-- 02b Data agent -->
                    <rect class="svg-box" x="163" y="154" width="124" height="94"/>
                    <line x1="163" y1="190" x2="287" y2="190" stroke="var(--line)" stroke-width="1"/>
                    <text class="svg-idx" x="225" y="179" text-anchor="middle">02b</text>
                    <text class="svg-agent" x="225" y="226" text-anchor="middle">Data / SQL</text>

                    <!-- 02c Tool agent -->
                    <rect class="svg-box" x="302" y="154" width="124" height="94"/>
                    <line x1="302" y1="190" x2="426" y2="190" stroke="var(--line)" stroke-width="1"/>
                    <text class="svg-idx" x="364" y="179" text-anchor="middle">02c</text>
                    <text class="svg-agent" x="364" y="226" text-anchor="middle">Tools</text>

                    <!-- MCP tool layer band -->
                    <rect class="svg-box" x="24" y="294" width="402" height="100"/>
                    <text class="svg-label" x="38" y="326">MCP tool layer</text>
                    <rect class="svg-chip" x="38" y="342" width="180" height="38"/>
                    <text class="svg-sub" x="128" y="367" text-anchor="middle">FastMCP</text>
                    <rect class="svg-chip" x="230" y="342" width="182" height="38"/>
                    <text class="svg-sub" x="321" y="367" text-anchor="middle">REST &harr; MCP</text>
                </svg>
            </div>
        </div>

        <div class="sheet-foot">
            <span class="foot-loc">Montevideo, Uruguay</span>
            <span class="foot-domain">constantinoferrucci.com.ar</span>
        </div>
    </div>
</body>
</html>
