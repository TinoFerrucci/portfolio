<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found | Constantino Ferrucci</title>
    <meta name="description" content="This page does not exist. Back to Constantino Ferrucci's portfolio.">
    <meta name="robots" content="noindex">

    <style>
        /* Same tokens as assets/css/styles.css: single vermilion accent over warm neutrals. */
        :root {
            color-scheme: light;
            --accent-rgb: 196,68,20;
            --accent: rgb(var(--accent-rgb));
            --tint: rgba(var(--accent-rgb), 0.10);
            --bg: #f6f5f1;
            --text: #1a1915;
            --text-secondary: #4d4b44;
            --text-muted: #66645c;
            --border: rgba(28,26,20,0.10);
            --on-accent: #ffffff;
            --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;
                --accent-rgb: 240,106,60;
                --tint: rgba(var(--accent-rgb), 0.12);
                --bg: #0e0e0c;
                --text: #eeede8;
                --text-secondary: rgba(255,255,255,0.66);
                --text-muted: rgba(255,255,255,0.48);
                --border: rgba(255,255,255,0.08);
                --on-accent: #16130f;
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            padding: 32px 24px;
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
        }
        main {
            width: 100%;
            max-width: 34rem;
            text-align: left;
        }
        .code {
            font-family: var(--mono);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--accent);
            background: var(--tint);
            border: 1px solid var(--border);
            border-radius: 6px;
            display: inline-block;
            padding: 5px 10px;
            margin-bottom: 24px;
        }
        h1 {
            font-size: clamp(1.9rem, 4vw, 2.5rem);
            line-height: 1.2;
            letter-spacing: -0.02em;
            font-weight: 650;
            max-width: 22ch;
            margin-bottom: 16px;
        }
        p {
            color: var(--text-secondary);
            max-width: 46ch;
            margin-bottom: 10px;
        }
        p.es {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 32px;
        }
        a.home {
            display: inline-block;
            padding: 13px 24px;
            border-radius: 8px;
            background: var(--accent);
            color: var(--on-accent);
            font: inherit;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
        }
        a.home:hover { filter: brightness(1.08); }
        a.home:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <main>
        <span class="code">error 404</span>
        <h1>This page doesn't exist</h1>
        <p>The link may be broken, or the page may have moved.</p>
        <p class="es" lang="es">Esta página no existe. El enlace puede estar roto o la página se movió.</p>
        <a class="home" href="/">Back to the portfolio</a>
    </main>
</body>
</html>
